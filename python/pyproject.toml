[project]
name = "bellwether-harness"
version = "0.1.0"
description = "Walk-forward training and evaluation harness for Bellwether"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6",
    "numpy>=2.2",
    "pyarrow>=19",
    "scikit-learn>=1.6",
]

[project.scripts]
bellwether-experiment = "bellwether_harness.experiment:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellwether_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
