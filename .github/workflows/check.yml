name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # gofmt, go vet, ruff, go test, pytest
      - run: python3 scripts/dev.py check

      - run: python3 scripts/dev.py test-race

      - name: Install Foundry
        # foundry-rs/foundry-toolchain@v1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false

      - name: Install Solidity test dependency
        run: forge install foundry-rs/forge-std@v1.16.2 --no-git
        working-directory: contracts

      - name: Run Solidity tests
        run: forge test
        working-directory: contracts
